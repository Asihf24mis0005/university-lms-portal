apiVersion: apps/v1
kind: Deployment
metadata:
  name: university-portal-deployment
  labels:
    app: university-portal
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: university-portal
  template:
    metadata:
      labels:
        app: university-portal
    spec:
      containers:
      - name: portal-container
   image: asihf/university-lms-portal:latest


        ports:
        - containerPort: 80
        imagePullPolicy: Always
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: university-portal-service
spec:
  type: NodePort
  selector:
    app: university-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32001
